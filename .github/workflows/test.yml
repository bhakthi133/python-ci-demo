name: Test Calculator
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Load code
        uses: actions/checkout@v4
      - name: Set Python
        uses: actions/setup-python@v5
      - name: Pytest run
        run: pip install pytest
      - name: Run tests
        run: pytest
