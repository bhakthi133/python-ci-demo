name: Test Calculator
on:
  push:
  pull_request:
  schedule:
    - cron: "0 2 * * *"   #ist = utc + 5:30 ie,ist=7:30 am
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Load code from repository
        uses: actions/checkout@v4

      - name: Set Python
        uses: actions/setup-python@v5

      - name: Pytest run
        run: pip install pytest

      - name: Build Docker image
        run: docker build -t image_cal .

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_TOKEN}}

      - name: Tag the image
        run: docker tag image_cal bhakthisp/image_cal:latest

      - name: Push the image
        run: docker push bhakthisp/image_cal:latest
        
      - name: Run tests
        run: pytest
